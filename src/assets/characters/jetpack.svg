<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11 20" width="11" height="20">
  <defs>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8fa8"/>
      <stop offset="0.35" stop-color="#e6e7f2"/>
      <stop offset="0.65" stop-color="#a6a8c0"/>
      <stop offset="1" stop-color="#6a6c88"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d72"/>
      <stop offset="1" stop-color="#14152b"/>
    </linearGradient>
  </defs>
  <!-- rear and front canisters (tinted in game, so each team's pack matches its colour) -->
  <rect x="5.2" y="2" width="4.2" height="13" rx="1.7" fill="url(#can)" stroke="#2a2c4a" stroke-width="0.3"/>
  <rect x="0.9" y="0.8" width="4.6" height="14" rx="1.8" fill="url(#can)" stroke="#2a2c4a" stroke-width="0.3"/>
  <!-- dark bands -->
  <rect x="0.9" y="3.4" width="4.6" height="0.9" fill="#3e4062"/>
  <rect x="0.9" y="10.6" width="4.6" height="0.9" fill="#3e4062"/>
  <rect x="5.2" y="4" width="4.2" height="0.8" fill="#3e4062"/>
  <rect x="5.2" y="11.2" width="4.2" height="0.8" fill="#3e4062"/>
  <!-- valve cap and strap plate -->
  <rect x="2.2" y="-0.2" width="2" height="1.2" rx="0.5" fill="#ffffff" stroke="#2a2c4a" stroke-width="0.2"/>
  <rect x="8.2" y="5" width="2.6" height="7" rx="0.7" fill="#3e4062" stroke="#14152b" stroke-width="0.2"/>
  <!-- nozzles -->
  <path d="M1.4 14.8 L5 14.8 L4.6 18.4 L1.8 18.4 Z" fill="url(#nozzle)" stroke="#0b0c1c" stroke-width="0.2"/>
  <path d="M5.8 15 L9 15 L8.6 18 L6.2 18 Z" fill="url(#nozzle)" stroke="#0b0c1c" stroke-width="0.2"/>
</svg>
