<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11 20" width="11" height="20">
  <defs>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#454c57"/>
      <stop offset="0.35" stop-color="#9aa2ae"/>
      <stop offset="0.6" stop-color="#6c7480"/>
      <stop offset="1" stop-color="#2f343c"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
  </defs>
  <!-- rear canister -->
  <rect x="5.2" y="2" width="4.2" height="13" rx="1.4" fill="url(#can)" stroke="#1a1d22" stroke-width="0.25"/>
  <!-- front canister -->
  <rect x="0.9" y="0.8" width="4.6" height="14" rx="1.5" fill="url(#can)" stroke="#1a1d22" stroke-width="0.25"/>
  <!-- bands -->
  <rect x="0.9" y="3.4" width="4.6" height="0.9" fill="#23272d"/>
  <rect x="0.9" y="10.6" width="4.6" height="0.9" fill="#23272d"/>
  <rect x="5.2" y="4" width="4.2" height="0.8" fill="#23272d"/>
  <rect x="5.2" y="11.2" width="4.2" height="0.8" fill="#23272d"/>
  <!-- valve caps -->
  <rect x="2.2" y="-0.2" width="2" height="1.2" rx="0.4" fill="#b6bcc6" stroke="#1a1d22" stroke-width="0.2"/>
  <!-- strap plate -->
  <rect x="8.2" y="5" width="2.6" height="7" rx="0.6" fill="#2a2b25" stroke="#14150f" stroke-width="0.2"/>
  <!-- status light -->
  <circle cx="3.2" cy="7.4" r="0.55" fill="#ffb347"/>
  <!-- nozzles -->
  <path d="M1.4 14.8 L5 14.8 L4.6 18.4 L1.8 18.4 Z" fill="url(#nozzle)" stroke="#07080a" stroke-width="0.2"/>
  <path d="M5.8 15 L9 15 L8.6 18 L6.2 18 Z" fill="url(#nozzle)" stroke="#07080a" stroke-width="0.2"/>
  <ellipse cx="3.2" cy="18.4" rx="1.4" ry="0.4" fill="#ff8a2a" opacity="0.8"/>
  <ellipse cx="7.4" cy="18" rx="1.2" ry="0.35" fill="#ff8a2a" opacity="0.8"/>
</svg>
