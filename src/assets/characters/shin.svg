  <path d="M0.7 13.8 L10.4 13.8 C10.9 13.8 11 14.5 10.4 14.85 L1.1 14.9 C0.6 14.9 0.5 14.2 0.7 13.8 Z" fill="#2e3050"/>
  <path d="M7.4 12.2 C8.6 12.2 9.8 12.6 10.2 13.2" fill="none" stroke="#ffffff" stroke-width="0.35" stroke-linecap="round" opacity="0.6"/>
