  </defs>
  <!-- lower leg -->
  <rect x="1.8" y="0.2" width="3.7" height="9.6" rx="1.5" fill="url(#limb)" stroke="#2a2c4a" stroke-width="0.3"/>
  <!-- chunky boot, toe pointing right -->
