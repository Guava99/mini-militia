<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 15" width="14" height="15">
  <defs>
    <linearGradient id="shell" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2e3ee"/>
      <stop offset="1" stop-color="#9ea0b8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f86"/>
      <stop offset="0.6" stop-color="#1c1f48"/>
      <stop offset="1" stop-color="#0b0c26"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <rect x="5.5" y="11.6" width="2.8" height="3.2" rx="0.7" fill="#7e8098" stroke="#2a2c4a" stroke-width="0.3"/>
  <!-- dome (tinted in game) -->
  <path d="M2.2 8.3 C2.2 3.5 5 1.7 7.6 1.7 C10.6 1.7 12.8 3.9 12.8 7.5 C12.8 10.7 10.4 12.7 7.4 12.7 C4.2 12.7 2.2 11.1 2.2 8.3 Z" fill="url(#shell)" stroke="#2a2c4a" stroke-width="0.35"/>
  <!-- rim light on the back of the head -->
  <path d="M2.6 8.6 C2.4 5.2 4 3.2 6 2.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
  <!-- visor frame -->
  <path d="M6.2 4.7 C6.2 3.9 6.9 3.5 8.2 3.5 L11 3.7 C12.1 3.9 12.7 4.8 12.7 6.1 C12.7 8 11.7 9.1 10 9.1 L8 9.1 C6.7 9.1 6.2 8.1 6.2 7 Z" fill="url(#visor)" stroke="#14152b" stroke-width="0.4"/>
  <!-- ear cap -->
  <circle cx="4.5" cy="8.1" r="1.45" fill="#c5c7d8" stroke="#2a2c4a" stroke-width="0.3"/>
  <circle cx="4.5" cy="8.1" r="0.6" fill="#3e4062"/>
  <!-- antenna stalk (the light on top is in head_accent) -->
  <path d="M5.7 2.1 L4.2 1" stroke="#3e4062" stroke-width="0.55" stroke-linecap="round"/>
</svg>
