<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 15" width="14" height="15">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcb08f"/>
      <stop offset="0.55" stop-color="#c9987a"/>
      <stop offset="1" stop-color="#a2745a"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6048"/>
      <stop offset="1" stop-color="#b98466"/>
    </linearGradient>
    <linearGradient id="helm" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7f8a64"/>
      <stop offset="0.5" stop-color="#5a6447"/>
      <stop offset="1" stop-color="#363d2b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0e6"/>
      <stop offset="0.5" stop-color="#4f7d92"/>
      <stop offset="1" stop-color="#1f3a48"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <path d="M5.1 10.6 L8.9 10.4 L9.4 14.8 L4.8 14.8 Z" fill="url(#neck)"/>
  <path d="M4.8 13.6 L9.4 13.4 L9.4 14.8 L4.8 14.8 Z" fill="#2c2d27" opacity="0.55"/>
  <!-- face profile (facing right) -->
  <path d="M4.9 5.6 L10 5.8 L10.7 7.5 L11.9 8.9 L10.8 9.5 L11 10.3 L10.3 11.4 L8.7 12.1 L5.5 11.5 Z" fill="url(#skin)"/>
  <path d="M5.5 10.2 L9.6 10.6 L10.3 11.4 L8.7 12.1 L5.5 11.5 Z" fill="#6e4a36" opacity="0.32"/>
  <!-- ear -->
  <ellipse cx="5.9" cy="8.9" rx="0.95" ry="1.35" fill="#a2745a"/>
  <ellipse cx="5.95" cy="8.9" rx="0.45" ry="0.8" fill="#7d553f"/>
  <!-- eye, brow, mouth -->
  <ellipse cx="9.2" cy="7.7" rx="0.85" ry="0.45" fill="#f2efe9"/>
  <circle cx="9.55" cy="7.7" r="0.36" fill="#2a2018"/>
  <path d="M8.2 6.85 L10.2 6.95" stroke="#3b2a20" stroke-width="0.45" stroke-linecap="round"/>
  <path d="M10 10.5 L10.9 10.45" stroke="#6a3f33" stroke-width="0.3" stroke-linecap="round"/>
  <!-- helmet shell -->
  <path d="M2.4 7.4 C1.9 3.2 4.8 0.5 8 0.5 C10.9 0.5 12.7 2.3 12.8 5.1 L13 6.2 L10.9 5.4 L5.1 5.8 L3.3 7.6 Z" fill="url(#helm)"/>
  <path d="M4 3 C5 2 6.4 2.4 6.6 3.4 C6.2 4.2 4.6 4.4 4 3.6 Z" fill="#2e3524" opacity="0.55"/>
  <path d="M8 1.6 C9.2 1.2 10.4 1.8 10.2 2.8 C9.4 3.2 8.2 2.9 8 1.6 Z" fill="#2e3524" opacity="0.5"/>
  <path d="M6.6 4.4 C7.6 3.8 8.8 4 9 4.6 C8.2 5 7 5 6.6 4.4 Z" fill="#8b966d" opacity="0.4"/>
  <!-- helmet rim -->
  <path d="M3.3 7.6 L5.1 5.8 L10.9 5.4 L13 6.2 L12.6 6.7 L10.8 6.1 L5.5 6.5 L3.7 8 Z" fill="#2b3022"/>
  <!-- goggles on helmet -->
  <path d="M3 4.4 L12.6 3.4" stroke="#232622" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="8.4" y="2.5" width="3.9" height="2.3" rx="0.9" fill="#1d2023"/>
  <rect x="8.8" y="2.8" width="3.1" height="1.7" rx="0.7" fill="url(#lens)"/>
  <path d="M9.3 3.1 L10.6 3 L10.2 3.5 L9.2 3.6 Z" fill="#ffffff" opacity="0.55"/>
  <!-- chin strap -->
  <path d="M5.4 8.4 L5.6 10.9 L8.6 12.1 L10.2 11.3" fill="none" stroke="#2c2d27" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9.9" cy="11.4" r="0.35" fill="#8d939b"/>
</svg>
