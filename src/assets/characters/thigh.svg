<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 12.4" width="7" height="12.4">
  <defs>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3223"/>
      <stop offset="0.5" stop-color="#4a5438"/>
      <stop offset="1" stop-color="#636e4c"/>
