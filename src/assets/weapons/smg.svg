<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 14" width="28" height="14">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7480"/>
      <stop offset="0.5" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15171a"/>
      <stop offset="1" stop-color="#3a3d44"/>
    </linearGradient>
  </defs>
  <!-- stock -->
  <path d="M0.4 3.2 L5 3.4 L5 6.4 L2.6 6.4 L0.4 4.8 Z" fill="#23262b" stroke="#0c0d0f" stroke-width="0.2"/>
  <!-- magazine -->
  <path d="M12 6.4 L15.2 6.4 L15.8 13.4 L12.8 13.4 Z" fill="url(#mag)" stroke="#0c0d0f" stroke-width="0.2"/>
  <path d="M12.3 8 L15.3 8 M12.5 9.6 L15.5 9.6 M12.6 11.2 L15.6 11.2" stroke="#555a63" stroke-width="0.18" opacity="0.7"/>
  <!-- pistol grip -->
  <path d="M6.2 6.4 L9.4 6.4 L8.6 12.6 L5.4 12.6 Z" fill="url(#mag)" stroke="#0c0d0f" stroke-width="0.2"/>
  <path d="M6.6 8 L9.2 8 M6.4 9.4 L9 9.4 M6.2 10.8 L8.8 10.8" stroke="#555a63" stroke-width="0.18" opacity="0.7"/>
  <!-- receiver -->
  <path d="M4.8 2.2 L22 2.2 L22 6.6 L4.8 6.6 Z" fill="url(#body)" stroke="#0c0d0f" stroke-width="0.25"/>
  <path d="M5.2 2.8 L21.6 2.8" stroke="#aab0ba" stroke-width="0.22" opacity="0.55"/>
  <rect x="9" y="3.6" width="4.6" height="1.2" fill="#0f1114"/>
  <!-- handguard with vents -->
  <path d="M22 2.6 L26.4 2.8 L26.4 6 L22 6.2 Z" fill="#2a2e35" stroke="#0c0d0f" stroke-width="0.22"/>
  <circle cx="23.2" cy="4.4" r="0.45" fill="#0c0d0f"/><circle cx="24.6" cy="4.4" r="0.45" fill="#0c0d0f"/><circle cx="26" cy="4.4" r="0.35" fill="#0c0d0f"/>
  <!-- barrel + muzzle device -->
  <rect x="26.4" y="3.4" width="1.4" height="1.9" fill="#14161a" stroke="#07080a" stroke-width="0.15"/>
  <!-- top rail, sights -->
  <rect x="6" y="1.3" width="14" height="0.9" fill="#1c1f24"/>
  <rect x="6.6" y="0.5" width="1.2" height="0.9" fill="#0f1114"/>
  <rect x="19.6" y="0.5" width="1" height="0.9" fill="#0f1114"/>
  <!-- trigger guard -->
  <path d="M9.4 6.6 C9.4 8.2 11.6 8.2 11.6 6.6" fill="none" stroke="#14161a" stroke-width="0.4"/>
</svg>
