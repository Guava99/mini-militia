<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 14" width="46" height="14">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8591"/>
      <stop offset="0.5" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="stock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6b4a"/>
      <stop offset="1" stop-color="#2c3524"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9dcf0"/>
      <stop offset="0.6" stop-color="#3f6f86"/>
      <stop offset="1" stop-color="#172e3a"/>
    </linearGradient>
  </defs>
  <!-- stock with cheek rest -->
  <path d="M0.4 4 L6 4 L12.6 4.6 L12.6 8 L7 8.4 L5 12.8 L0.4 12.8 Z" fill="url(#stock)" stroke="#161c11" stroke-width="0.25"/>
  <path d="M0.8 5.2 L5.6 5.2" stroke="#8b9a74" stroke-width="0.2" opacity="0.55"/>
  <rect x="0.2" y="4.6" width="1.2" height="7.6" fill="#14161a"/>
  <!-- receiver -->
  <path d="M12.6 3.6 L24 3.6 L24 8 L12.6 8.2 Z" fill="url(#steel)" stroke="#07080a" stroke-width="0.25"/>
  <path d="M13.2 4.2 L23.6 4.2" stroke="#c4cad3" stroke-width="0.2" opacity="0.5"/>
  <rect x="17.5" y="4.8" width="4.5" height="1" fill="#0b0c0e"/>
  <!-- bolt handle -->
  <path d="M15.6 5.2 L15.6 6.6 L13.8 7.4" fill="none" stroke="#aab0ba" stroke-width="0.5" stroke-linecap="round"/>
  <!-- grip + trigger guard -->
  <path d="M11.2 8.2 L14.6 8.2 L13.8 12.6 L10.6 12.6 Z" fill="#202328" stroke="#07080a" stroke-width="0.22"/>
  <path d="M15 8.2 C15 10.2 18.2 10.2 18 8.2" fill="none" stroke="#14161a" stroke-width="0.4"/>
  <!-- magazine -->
  <path d="M18.6 8 L22.2 8 L22 10.6 L18.8 10.6 Z" fill="#1a1c20" stroke="#07080a" stroke-width="0.2"/>
  <!-- long barrel + muzzle brake -->
  <rect x="24" y="4.6" width="20" height="1.9" fill="url(#steel)" stroke="#07080a" stroke-width="0.22"/>
  <rect x="42" y="3.9" width="3.4" height="3.3" rx="0.4" fill="#23262c" stroke="#07080a" stroke-width="0.22"/>
  <path d="M43 4.2 L43 6.9 M44.2 4.2 L44.2 6.9" stroke="#07080a" stroke-width="0.3"/>
  <!-- handguard and folded bipod -->
  <path d="M24 6.4 L34 6.4 L34 7.6 L24 7.6 Z" fill="#2c3037" stroke="#07080a" stroke-width="0.2"/>
  <path d="M30 7.6 L28.4 11 M31.4 7.6 L33 11" stroke="#4a505a" stroke-width="0.5" stroke-linecap="round"/>
  <!-- scope: tube, bells, lens, mounts -->
  <rect x="14.5" y="0.7" width="16" height="2.4" rx="1.1" fill="url(#steel)" stroke="#07080a" stroke-width="0.22"/>
  <path d="M13.2 0.2 L15.6 0.7 L15.6 3.1 L13.2 3.6 Z" fill="#23262c" stroke="#07080a" stroke-width="0.2"/>
  <path d="M32.6 0 L30.2 0.7 L30.2 3.1 L32.6 3.8 Z" fill="#23262c" stroke="#07080a" stroke-width="0.2"/>
  <ellipse cx="32.4" cy="1.9" rx="0.5" ry="1.5" fill="url(#lens)"/>
  <rect x="17" y="3" width="1.6" height="1" fill="#14161a"/>
  <rect x="26.6" y="3" width="1.6" height="1" fill="#14161a"/>
  <path d="M16 1.2 L29.5 1.2" stroke="#c9ced6" stroke-width="0.2" opacity="0.55"/>
</svg>
